name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Meerkat.slnx

      - name: Build
        run: dotnet build Meerkat.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Meerkat.slnx --configuration Release --no-build
